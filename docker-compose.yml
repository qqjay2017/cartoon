services:
  postgres:
    image: postgres:16-alpine
    container_name: cartoon-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: cartoon
      POSTGRES_USER: cartoon
      POSTGRES_PASSWORD: cartoon
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cartoon -d cartoon']
      interval: 5s
      timeout: 5s
      retries: 5
